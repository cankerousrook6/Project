<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>

<h1>${book.title}</h1>

<p>Author: ${book.author}</p>
<p>${book.description}</p>

<#if book.image??>
<img src="${book.image}" alt="${book.title}" width="200">
</#if>

<#if book.available>
<p>Available</p>
<p><a href="/take-book?id=${book.id}">Take book</a></p>
<#else>
<p>Issued to: ${book.ownerEmail}</p>
<p><a href="/return-book?id=${book.id}">Return book</a></p>
</#if>

<a href="/books">Back</a>

</body>
</html>
