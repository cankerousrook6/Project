<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="css/forms.css">
</head>

<body>
<main>
  <h1>Profile</h1>

  <p>Name: ${user.name}</p>
  <p>Email: ${user.email}</p>

  <p>
    <a href="/books">Books</a>
  </p>

  <h2>Books history</h2>

  <ul>
    <#list books as book>
    <li>${book.title} - ${book.author}</li>
    <#else>
    <li>No books yet</li>
  </#list>
  </ul>

  <p><a href="/logout">Logout</a></p>

</main>
</body>
</html>
