<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>

<h1>Books</h1>

<ul>
    <#list books as book>

    <li>
        <a href="/book?id=${book.id}">${book.title}</a>

        <#if !book.available>
        - issued
        <#else>
        - available
    </#if>

    </li>

</#list>
</ul>

<a href="/employee">Employee</a>

</body>
</html>
