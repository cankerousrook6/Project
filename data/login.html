<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/css/forms.css">
</head>
<body>

<main>

    <h1 style="text-align:center; margin-bottom:20px;">Library System</h1>

    <form action="/login" method="post">
        <fieldset>

            <div class="legend">
                <h2>Welcome!</h2>
                <img src="/images/1.jpg" alt="Library" width="170">
            </div>

            <#if error??>
            <div style="color:red; text-align:center; margin-bottom:15px; font-weight:bold;">
                ${error}
            </div>
        </#if>

        <div class="form-element">
            <label for="user-email">Email</label>
            <input
                    type="email"
                    id="user-email"
                    name="email"
                    placeholder="Enter your email"
                    required>
        </div>

        <div class="form-element">
            <label for="user-password">Password</label>
            <input
                    type="password"
                    id="user-password"
                    name="user-password"
                    placeholder="Enter your password"
                    required>
        </div>

        <div class="hr-line">
            <span class="details">Sign in to continue</span>
        </div>

        <div class="form-element">
            <button
                    class="register-button"
                    type="submit"
                    style="width:100%; padding:10px; font-size:16px;">
                Login
            </button>
        </div>
        </fieldset>
    </form>
</main>
</body>
</html>
